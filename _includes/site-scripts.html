<script>
(function () {
  // Interactive quiz: click an option, get instant per-option feedback.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.rr-quiz-option');
    if (!btn) return;
    var quiz = btn.closest('.rr-quiz');
    if (!quiz || quiz.classList.contains('rr-quiz-solved')) return;

    var feedback = quiz.querySelector('.rr-quiz-feedback');
    var correct = btn.dataset.option === quiz.dataset.answer;

    quiz.querySelectorAll('.rr-quiz-option').forEach(function (b) {
      b.classList.remove('is-correct', 'is-incorrect');
    });
    btn.classList.add(correct ? 'is-correct' : 'is-incorrect');

    feedback.hidden = false;
    feedback.textContent = (correct ? '✅ ' : '❌ ') + btn.dataset.feedback;
    feedback.className = 'rr-quiz-feedback ' + (correct ? 'is-correct' : 'is-incorrect');

    if (correct) {
      quiz.classList.add('rr-quiz-solved');
      quiz.querySelectorAll('.rr-quiz-option').forEach(function (b) { b.disabled = true; });
    }
  });

  // R Passport finale: type a name, reveal an animated "passport" card.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.rr-passport-button');
    if (!btn) return;
    var wrap = btn.closest('.rr-passport');
    var input = wrap.querySelector('.rr-passport-input');
    var name = (input.value || '').trim();

    if (!name) {
      input.focus();
      input.classList.remove('rr-shake');
      void input.offsetWidth; // restart the animation if triggered twice in a row
      input.classList.add('rr-shake');
      return;
    }

    wrap.querySelector('.rr-passport-name').textContent = name;
    wrap.classList.add('rr-passport-revealed');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var input = e.target.closest('.rr-passport-input');
    if (!input) return;
    e.preventDefault();
    input.closest('.rr-passport').querySelector('.rr-passport-button').click();
  });
})();
</script>
